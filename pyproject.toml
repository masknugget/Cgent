[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cgent-tui"
description = "Terminal client for the Cgent REST Agent Harness"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2,<9",
    "httpx>=0.28.1,<1",
]
dynamic = ["version"]

[project.scripts]
cgent-tui = "cgent_tui.cli:main"
cgent-desktop = "cgent_desktop.cli:main"

[project.optional-dependencies]
desktop = [
    "PySide6>=6.7",
    "PySide6-Fluent-Widgets>=1.7",
    "QtAwesome>=1.3",
    "pyqtdarktheme>=2.1",
    "superqt>=0.7",
]

[tool.setuptools]
packages = [
    "cgent_tui",
    "cgent_tui.widgets",
    "cgent_desktop",
    "cgent_desktop.models",
    "cgent_desktop.services",
    "cgent_desktop.theme",
    "cgent_desktop.ui",
]

[tool.setuptools.dynamic]
version = {attr = "cgent_tui.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "real_model: requires explicit OpenAI-compatible provider credentials",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]

[tool.ty.src]
include = ["cgent", "cgent_tui", "cgent_desktop", "tests"]

[tool.ty.terminal]
error-on-warning = false
